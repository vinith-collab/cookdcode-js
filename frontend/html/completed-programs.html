<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Completed Programs - CookDCode</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/completed-program.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
</head>

<body>

  <div class="dashboard-layout">
    <script>
      // Global priority dropdown toggle - defined early for instant response
      window.toggleDropdown = (e) => {
        if (e) e.stopPropagation();
        const dropdown = document.getElementById('dropdownMenu');
        if (dropdown) {
          dropdown.classList.toggle('active');
        }
      };
    </script>
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebarClose" aria-label="Close Menu">
        <i class="fas fa-times"></i>
      </button>
      <nav class="sidebar-nav">
        <a href="ctc.html" class="sidebar-link">
          <i class="fas fa-th-large"></i>
          <span>Dashboard</span>
        </a>
        <a href="ongoingprograms.html" class="sidebar-link">
          <i class="fas fa-spinner fa-spin-hover"></i>
          <span>Ongoing Programs</span>
        </a>
        <a href="completed-programs.html" class="sidebar-link active">
          <i class="fas fa-check-circle"></i>
          <span>Completed Programs</span>
        </a>
        

      </nav>
      
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
      <nav class="navbar">
        <div class="nav-left">
          <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle Menu" style="display: none;">
            <i class="fas fa-bars"></i>
          </button>

          <a href="ctc.html" class="brand">
            <img src="../Images/logo.png" alt="cookDcode Logo" class="logo" />
            <span>cookDcode</span>
          </a>
        </div>

        <div class="navbar-right">
          <div class="profile-menu">
            <button class="avatar-btn" id="avatarBtn" onclick="toggleDropdown(event)" aria-label="User Profile">
              <img src="../Images/profile.jpg" alt="Profile Avatar" id="userAvatar" onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22%23f8fafc%22%2F%3E%3Cpath%20d%3D%22M12%2012c2.21%200%204-1.79%204-4s-1.79-4-4-4-4%201.79-4%204%201.79%204%204%204zm0%202c-2.67%200-8%201.34-8%204v2h16v-2c0-2.66-5.33-4-8-4z%22%20fill%3D%22%2394a3b8%22%2F%3E%3C%2Fsvg%3E';" />
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
              <div class="dropdown-header">
                <span class="dropdown-title">Welcome,</span>
                <span class="dropdown-email" id="dropdownEmail">User Name</span>
              </div>
              <a href="edit-profile.html" class="dropdown-item">
                <i class="fas fa-user-edit"></i>
                Edit Profile
              </a>
              <div class="dropdown-divider"></div>
              <a href="#" class="dropdown-item" onclick="logoutUser()">
                <i class="fas fa-sign-out-alt"></i>
                Log Out
              </a>
            </div>
          </div>
        </div>
      </nav>

  <main class="container">
    <section class="carousel-section">
      <div class="section-header">
        <h2 class="section-title">Your Achievements</h2>
      </div>
      <div class="cards-grid">

        <!-- Card 1 -->

      </div>
    </section>
  </main>

  <script type="module">

    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    /* FIREBASE */

    const firebaseConfig = {
      apiKey: "AIzaSyBoAb7b3DJDMRmNwOSAHTnscM_-JuVnILI",
      authDomain: "cookdcode-4ce23.firebaseapp.com",
      databaseURL: "https://cookdcode-4ce23-default-rtdb.firebaseio.com",
      projectId: "cookdcode-4ce23",
      storageBucket: "cookdcode-4ce23.appspot.com",
      messagingSenderId: "419836764054",
      appId: "1:419836764054:web:ab9968082fb793029f07b7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const uid = localStorage.getItem("userId") || localStorage.getItem("uid");

    // Modal Utility
    window.showModal = function(msg, type = 'success') {
      const modal = document.getElementById('statusModal');
      const icon = document.getElementById('modalIcon');
      const title = document.getElementById('modalTitle');
      const message = document.getElementById('modalMessage');
      
      message.textContent = msg;
      
      if(type === 'error' || type === 'warning') {
        icon.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
        icon.style.color = '#ef4444';
        icon.style.backgroundColor = '#fef2f2';
        title.textContent = 'Action Required';
      } else {
        icon.innerHTML = '<i class="fas fa-check-circle"></i>';
        icon.style.color = '#10b981';
        icon.style.backgroundColor = '#ecfdf5';
        title.textContent = 'Success!';
      }
      
      modal.classList.add('active');
    };

    window.closeModal = function() {
      document.getElementById('statusModal').classList.remove('active');
    };

    if (!uid || uid === "guest_user") {
      window.location.href = "newuser.html";
    }

    /* MAIN CONTAINER */

    /* LOAD LOGGED-IN USER PROFILE */

    async function loadUserProfile() {
      if (!uid) return;
      try {
        const userRef = ref(db, "users/" + uid);
        const snapshot = await get(userRef);
        if (snapshot.exists()) {
          const data = snapshot.val();
          if (data.profileImage) {
            document.getElementById("userAvatar").src = data.profileImage;
          }
          // Display User Name instead of Email
          const userName = data.firstname ? (data.firstname + " " + (data.lastname || "")) : (localStorage.getItem("userEmail") || "User");
          document.getElementById("dropdownEmail").textContent = userName;
          
          if (data.tokens !== undefined && document.getElementById("tokenCount")) {
            document.getElementById("tokenCount").textContent = data.tokens;
          }
        }
      } catch (err) {
        console.error("Profile load error:", err);
      }
    }

    /* CALL FUNCTION */

    loadUserProfile();



    const container = document.querySelector(".carousel-section");

    /* OPEN PROBLEM */

    window.openProblem = function (category, problemID) {

      window.location.href =
        "tryctc.html?category=" +
        encodeURIComponent(category) +
        "&problemID=" +
        encodeURIComponent(problemID);

    };

    /* LOAD COMPLETED PROGRAMS */

    async function loadCompleted() {
      const snapshot = await get(ref(db, `userProgress/${uid}/programs`));
      let programs = snapshot.exists() ? snapshot.val() : {};

      if (Object.keys(programs).length === 0) {
        container.innerHTML = "<p style='padding: 2rem; color: #64748b; font-weight: 500;'>No completed programs found. Keep coding to earn your first badge!</p>";
        return;
      }
      let totalCompletedCount = 0;
      let sectionsHTML = "";

      // PREDEFINED ORDER (SOPHISTICATED HIERARCHY)
      const orderedCategories = [
        { key: "fundamentals", name: "Fundamentals", phase: "1" },
        { key: "string", name: "String", phase: "2" },
        { key: "array", name: "Array", phase: "3" },
        { key: "dsa", name: "DSA", phase: "4" }
      ];

      orderedCategories.forEach(catInfo => {
        const category = catInfo.key;
        if (programs[category]) {
          let categoryCards = "";
          let categoryCount = 0;

          for (const problemID in programs[category]) {
            const data = programs[category][problemID];
            if (data.progress === 100) {
              totalCompletedCount++;
              categoryCount++;
              let number = problemID.replace("problem", "");
              number = parseInt(number) || 0;
              let icon = "<i class='fas fa-check'></i>";
              let offset = 0;

              const KNOWN_PROBLEM_NAMES = {
                fundamentals: { problem01: "Odd or Even", problem02: "Sum of N Numbers", problem03: "Factorial of a Number", problem04: "Divisors of a Number", problem05: "Multiplication Table", problem06: "Prime Number Checker", problem07: "Next Prime Number", problem08: "Prime Numbers in Range", problem09: "Sexy Prime Pairs", problem10: "Positive or Negative", problem11: "Three-Digit Number", problem12: "Voting Eligibility", problem13: "Pass or Fail", problem14: "Greater Than 100", problem15: "Profit or Loss", problem16: "Leap Year or Not", problem17: "Adult or Minor", problem18: "Divisible by 5 or Not", problem19: "Maximum of Two Numbers", problem20: "Vowel or Consonant", problem21: "Print Even Numbers from 1 to 50", problem22: "Print Odd Numbers from 1 to 50" },
                array: { problem01: "Bubble Sort", problem02: "Selection Sort", problem03: "Quick Sort", problem04: "Insertion Sort", problem05: "Binary Search", problem06: "Greatest Number of an Array" },
                string: { problem01: "Anagram" },
                dsa: { problem01: "Linear Search" }
              };
              const catKey = (category || "").toLowerCase();
              const probKey = (problemID || "").toLowerCase();
              const probTitle = (KNOWN_PROBLEM_NAMES[catKey] && KNOWN_PROBLEM_NAMES[catKey][probKey]) || `Challenge ${number}`;
              const badgeNum = number < 10 ? `0${number}` : `${number}`;

              categoryCards += `
                            <div class="card completed">
                              <span class="card-badge">PROBLEM ${badgeNum}</span>
                              <div style="font-weight: 700; font-size: 14.5px; color: #1e293b; margin: 10px 0 6px; text-align: center; min-height: 42px; display: flex; align-items: center; justify-content: center; line-height: 1.35; padding: 0 4px;">
                                ${probTitle}
                              </div>
                              <div class="progress-container">
                                <svg class="progress-svg" viewBox="0 0 100 100">
                                  <circle class="progress-bg" cx="50" cy="50" r="40"></circle>
                                  <circle class="progress-bar" cx="50" cy="50" r="40" style="stroke-dashoffset:${offset}"></circle>
                                </svg>
                                <div class="progress-text">
                                  <span class="value">${icon}</span>
                                </div>
                              </div>
                              <a href="#" class="btn" onclick="openProblem('${category}','${problemID}')">Review Solution</a>
                            </div>
                          `;
            }
          }

          if (categoryCount > 0) {
            sectionsHTML += `
                          <div class="category-section">
                            <h2 class="category-title">
                                <span class="phase-tag">Phase ${catInfo.phase}</span>
                                <span class="category-name">${catInfo.name}</span>
                            </h2>
                            <div class="cards-wrapper">
                              ${categoryCards}
                            </div>
                          </div>
                        `;
          }
        }
      });

      if (totalCompletedCount === 0) {
        container.innerHTML = "<p style='padding: 2rem; color: #64748b; font-weight: 500;'>No completed programs found. Keep coding to earn your first badge!</p>";
      } else {
        container.innerHTML = `
                      <div class="section-header">
                        <h2 class="section-title">Your Achievements (${totalCompletedCount} Completed)</h2>
                      </div>
                      ${sectionsHTML}
                    `;
      }
    }
    loadCompleted();

    // Close dropdown on outside click
    document.addEventListener('click', (e) => {
        const dropdown = document.getElementById('dropdownMenu');
        const btn = document.getElementById('avatarBtn');
        if (dropdown && !dropdown.contains(e.target) && !btn.contains(e.target)) {
            dropdown.classList.remove('active');
        }
    });

    // Mobile Toggle
    const mobileToggle = document.getElementById('mobileToggle');
    const sidebarClose = document.getElementById('sidebarClose');
    const sidebar = document.getElementById('sidebar');

    if (mobileToggle) {
      mobileToggle.addEventListener('click', () => {
        sidebar.classList.add('mobile-active');
      });
    }

    if (sidebarClose) {
      sidebarClose.addEventListener('click', () => {
        sidebar.classList.remove('mobile-active');
      });
    }

    window.logoutUser = () => {
      localStorage.clear();
      window.location.href = "login.html";
    };
  </script>
    </div>
  </div>
  <!-- Professional Status Modal -->
  <div id="statusModal" class="modal-overlay">
    <div class="modal-content">
      <div id="modalIcon" class="modal-icon">
        <i class="fas fa-check-circle"></i>
      </div>
      <h3 id="modalTitle" class="modal-title">Success!</h3>
      <p id="modalMessage" class="modal-message">Your progress has been saved.</p>
      <button class="modal-btn" onclick="closeModal()">Continue</button>
    </div>
  </div>
</body>

</html>
