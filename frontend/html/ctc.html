<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CookDCode - Dashboard</title>
  <link rel="icon" type="image/png" href="../Images/logo.png">

  <!-- Critical External Assets -->
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="../css/ctc.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />

  <style>
    /* Instant Load - No more blank 5 seconds */
    .skeleton-card {
      height: 380px;
      border-radius: 1.5rem;
      background: #e2e8f0;
      animation: pulse 1.5s infinite;
    }

    @keyframes pulse {
      0% {
        opacity: 1;
      }

      50% {
        opacity: 0.5;
      }

      100% {
        opacity: 1;
      }
    }
  </style>
</head>

<body>
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <button class="sidebar-close" id="sidebarClose" aria-label="Close Menu">
        <i class="fas fa-times"></i>
      </button>
      <nav class="sidebar-nav">
        <a href="ctc.html" class="sidebar-link active">
          <i class="fas fa-th-large"></i>
          <span>Dashboard</span>
        </a>
        <a href="ongoingprograms.html" class="sidebar-link">
          <i class="fas fa-spinner fa-spin-hover"></i>
          <span>Ongoing Programs</span>
        </a>
        <a href="completed-programs.html" class="sidebar-link">
          <i class="fas fa-check-circle"></i>
          <span>Completed Programs</span>
        </a>


      </nav>


    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
      <nav class="navbar">
        <div class="nav-left">
          <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle Menu" style="display: none;">
            <i class="fas fa-bars"></i>
          </button>
          <a href="ctc.html" class="brand">
            <img src="../Images/logo.png" alt="cookDcode Logo" class="logo" />
            <span>cookDcode</span>
          </a>
        </div>

        <div class="navbar-right">
          <div class="profile-menu">
            <button class="avatar-btn" id="avatarBtn" aria-label="User Profile">
              <img src="../Images/profile.jpg" alt="Profile Avatar" id="userAvatar"
                onerror="this.onerror=null;this.src='data:image/svg+xml;charset=UTF-8,%3Csvg%20xmlns%3D%22http%3A%2F%2Fwww.w3.org%2F2000%2Fsvg%22%20viewBox%3D%220%200%2024%2024%22%3E%3Crect%20width%3D%2224%22%20height%3D%2224%22%20fill%3D%22%23f8fafc%22%2F%3E%3Cpath%20d%3D%22M12%2012c2.21%200%204-1.79%204-4s-1.79-4-4-4-4%201.79-4%204%201.79%204%204%204zm0%202c-2.67%200-8%201.34-8%204v2h16v-2c0-2.66-5.33-4-8-4z%22%20fill%3D%22%2394a3b8%22%2F%3E%3C%2Fsvg%3E';" />
            </button>
            <div class="dropdown-menu" id="dropdownMenu">
              <div class="dropdown-header">
                <span class="dropdown-title">Welcome,</span>
                <span class="dropdown-email" id="dropdownEmail">User Name</span>
              </div>
              <a href="edit-profile.html" class="dropdown-item">
                <i class="fas fa-user-edit"></i>
                Edit Profile
              </a>
              <div class="dropdown-divider"></div>
              <a href="#" class="dropdown-item" onclick="logoutUser()">
                <i class="fas fa-sign-out-alt"></i>
                Log Out
              </a>
            </div>
          </div>
        </div>
      </nav>

      <main class="container">
        <div class="category-section">
          <h2 class="category-title">
            <span class="phase-tag">Phase 1</span>
            <span class="category-name">Fundamentals</span>
          </h2>
          <div id="fundamentalsContainer" class="cards-wrapper">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>

        <div class="category-section">
          <h2 class="category-title">
            <span class="phase-tag">Phase 2</span>
            <span class="category-name">String</span>
          </h2>
          <div id="stringContainer" class="cards-wrapper">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>

        <div class="category-section">
          <h2 class="category-title">
            <span class="phase-tag">Phase 3</span>
            <span class="category-name">Array</span>
          </h2>
          <div id="arrayContainer" class="cards-wrapper">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>

        <div class="category-section">
          <h2 class="category-title">
            <span class="phase-tag">Phase 4</span>
            <span class="category-name">DSA</span>
          </h2>
          <div id="dsaContainer" class="cards-wrapper">
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
            <div class="skeleton-card"></div>
          </div>
        </div>
      </main>

      <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
        import { getDatabase, ref, onValue, get } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

        const firebaseConfig = {
          apiKey: "AIzaSyBoAb7b3DJDMRmNwOSAHTnscM_-JuVnILI",
          authDomain: "cookdcode-4ce23.firebaseapp.com",
          databaseURL: "https://cookdcode-4ce23-default-rtdb.firebaseio.com",
          projectId: "cookdcode-4ce23",
          storageBucket: "cookdcode-4ce23.firebasestorage.app",
          messagingSenderId: "419836764054",
          appId: "1:419836764054:web:ab9968082fb793029f07b7"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);
        const uid = localStorage.getItem("userId") || localStorage.getItem("uid");
        if (!uid) {
          window.location.replace("newuser.html");
        }

        // Mobile Toggle
        const mobileToggle = document.getElementById('mobileToggle');
        const sidebarClose = document.getElementById('sidebarClose');
        const sidebar = document.getElementById('sidebar');

        if (mobileToggle) {
          mobileToggle.addEventListener('click', () => {
            sidebar.classList.add('mobile-active');
          });
        }

        if (sidebarClose) {
          sidebarClose.addEventListener('click', () => {
            sidebar.classList.remove('mobile-active');
          });
        }
        const containers = {
          fundamentals: document.getElementById("fundamentalsContainer"),
          string: document.getElementById("stringContainer"),
          array: document.getElementById("arrayContainer"),
          dsa: document.getElementById("dsaContainer")
        };

        async function loadDashboardData() {
          try {
            // Fetch User Profile, Programs, and User's Own Progress
            const fetchPromises = [
              get(ref(db, "users/" + uid)),
              get(ref(db, "programs")),
              get(ref(db, `userProgress/${uid}/programs`))
            ];

            const results = await Promise.all(fetchPromises);
            const profileSnap = results[0];
            const programsSnap = results[1];
            const userProgressSnap = results[2];

            // 1. Update Profile UI
            if (profileSnap.exists()) {
              const data = profileSnap.val();
              if (data.profileImage) document.getElementById("userAvatar").src = data.profileImage;

              // Display User Name instead of Email
              const userName = data.firstname ? (data.firstname + " " + (data.lastname || "")) : (localStorage.getItem("userEmail") || "User");
              document.getElementById("dropdownEmail").textContent = userName;

              if (data.tokens !== undefined && document.getElementById("tokenCount")) document.getElementById("tokenCount").textContent = data.tokens;
            }

            // 2. Render Programs - strictly for this user (brand new accounts have empty progress = 0%)
            let userProgress = userProgressSnap.exists() ? userProgressSnap.val() : {};

            // Ensure dropdown email and initial avatar are set if no profileImageUrl
            if (!profileSnap.exists()) {
              const email = localStorage.getItem("userEmail") || "user@example.com";
              document.getElementById("dropdownEmail").textContent = email;
              document.getElementById("userAvatar").src = `https://ui-avatars.com/api/?name=${email.split('@')[0]}&background=3a86cc&color=fff&rounded=true`;
            }

            Object.values(containers).forEach(c => { if (c) c.innerHTML = ""; });

            const FALLBACK_PROGRAMS = [
              { id: "problem01", num: "1", title: "Odd or Even", category: "fundamentals" },
              { id: "problem02", num: "2", title: "Sum of N Numbers", category: "fundamentals" },
              { id: "problem03", num: "3", title: "Factorial of a Number", category: "fundamentals" },
              { id: "problem04", num: "4", title: "Divisors of a Number", category: "fundamentals" },
              { id: "problem05", num: "5", title: "Multiplication Table", category: "fundamentals" },
              { id: "problem06", num: "6", title: "Prime Number Checker", category: "fundamentals" },
              { id: "problem07", num: "7", title: "Next Prime Number", category: "fundamentals" },
              { id: "problem08", num: "8", title: "Prime Numbers in Range", category: "fundamentals" },
              { id: "problem09", num: "9", title: "Sexy Prime Pairs", category: "fundamentals" },
              { id: "problem10", num: "10", title: "Positive or Negative", category: "fundamentals" },
              { id: "problem11", num: "11", title: "Three-Digit Number", category: "fundamentals" },
              { id: "problem12", num: "12", title: "Voting Eligibility", category: "fundamentals" },
              { id: "problem13", num: "13", title: "Pass or Fail", category: "fundamentals" },
              { id: "problem14", num: "14", title: "Greater Than 100", category: "fundamentals" },
              { id: "problem15", num: "15", title: "Profit or Loss", category: "fundamentals" },
              { id: "problem16", num: "16", title: "Leap Year or Not", category: "fundamentals" },
              { id: "problem17", num: "17", title: "Adult or Minor", category: "fundamentals" },
              { id: "problem18", num: "18", title: "Divisible by 5 or Not", category: "fundamentals" },
              { id: "problem19", num: "19", title: "Maximum of Two Numbers", category: "fundamentals" },
              { id: "problem20", num: "20", title: "Vowel or Consonant", category: "fundamentals" },
              { id: "problem21", num: "21", title: "Print Even Numbers from 1 to 50", category: "fundamentals" },
              { id: "problem22", num: "22", title: "Print Odd Numbers from 1 to 50", category: "fundamentals" }
            ];

            const KNOWN_PROBLEM_NAMES = {
              fundamentals: {
                problem01: "Odd or Even",
                problem02: "Sum of N Numbers",
                problem03: "Factorial of a Number",
                problem04: "Divisors of a Number",
                problem05: "Multiplication Table",
                problem06: "Prime Number Checker",
                problem07: "Next Prime Number",
                problem08: "Prime Numbers in Range",
                problem09: "Sexy Prime Pairs",
                problem10: "Positive or Negative",
                problem11: "Three-Digit Number",
                problem12: "Voting Eligibility",
                problem13: "Pass or Fail",
                problem14: "Greater Than 100",
                problem15: "Profit or Loss",
                problem16: "Leap Year or Not",
                problem17: "Adult or Minor",
                problem18: "Divisible by 5 or Not",
                problem19: "Maximum of Two Numbers",
                problem20: "Vowel or Consonant",
                problem21: "Print Even Numbers from 1 to 50",
                problem22: "Print Odd Numbers from 1 to 50"
              },
              array: {
                problem01: "Bubble Sort",
                problem02: "Selection Sort",
                problem03: "Quick Sort",
                problem04: "Insertion Sort",
                problem05: "Binary Search",
                problem06: "Greatest Number of an Array"
              },
              string: {
                problem01: "Anagram"
              },
              dsa: {
                problem01: "Linear Search"
              }
            };

            function getProblemDisplayName(category, problemID, val) {
              const catKey = (category || "").toLowerCase();
              const probKey = (problemID || "").toLowerCase();
              let name = val?.programName || val?.program_name || val?.title || val?.Title || val?.name || "";
              
              if (!name || name.trim() === "" || /^problem\s*\d+$/i.test(name.trim())) {
                if (KNOWN_PROBLEM_NAMES[catKey] && KNOWN_PROBLEM_NAMES[catKey][probKey]) {
                  return KNOWN_PROBLEM_NAMES[catKey][probKey];
                }
                const num = parseInt(probKey.replace(/\D/g, ""), 10) || "";
                return num ? `Challenge ${num}` : "Challenge";
              }

              return name.trim().split(/\s+/).map((w, idx) => {
                const lower = w.toLowerCase();
                if (idx > 0 && ['of', 'a', 'an', 'or', 'in', 'and', 'the', 'to', 'by'].includes(lower)) {
                  return lower;
                }
                return lower.charAt(0).toUpperCase() + lower.slice(1);
              }).join(' ');
            }

            let renderedAny = false;

            function isProblemDone(cat, pId) {
              if (userProgress && userProgress[cat] && userProgress[cat][pId]) {
                const p = userProgress[cat][pId];
                if (p.progress === 100 || p.status === 'completed' || p.compilerExecuted === true) {
                  return true;
                }
              }
              // Only check user-scoped local storage for THIS authenticated uid
              if (uid) {
                if (localStorage.getItem(`ctc_compiler_executed_${uid}_${pId}`) === 'true') {
                  return true;
                }
                try {
                  const local = localStorage.getItem(`ctc_progress_${uid}_${cat}_${pId}`);
                  if (local) {
                    const parsed = JSON.parse(local);
                    if (parsed.progress === 100 || parsed.status === 'completed' || parsed.compilerExecuted === true) {
                      return true;
                    }
                  }
                } catch (e) {}
              }
              return false;
            }

            if (programsSnap && programsSnap.exists()) {
              programsSnap.forEach((catSnap) => {
                const category = catSnap.key.toLowerCase();
                const probList = [];
                catSnap.forEach((probSnap) => {
                  const problemID = probSnap.key;
                  const rawNum = parseInt(problemID.replace(/\D/g, ""), 10);
                  probList.push({
                    id: problemID,
                    rawNum: !isNaN(rawNum) ? rawNum : 999,
                    val: probSnap.val() || {}
                  });
                });

                // Merge any missing programs from FALLBACK_PROGRAMS for this category
                FALLBACK_PROGRAMS.filter(fp => fp.category.toLowerCase() === category).forEach(fp => {
                  const alreadyExists = probList.some(p => p.id.toLowerCase() === fp.id.toLowerCase() || p.rawNum === parseInt(fp.num, 10));
                  if (!alreadyExists) {
                    probList.push({
                      id: fp.id,
                      rawNum: parseInt(fp.num, 10) || 999,
                      val: { programName: fp.title, title: fp.title, category: fp.category }
                    });
                  }
                });

                probList.sort((a, b) => a.rawNum - b.rawNum);

                // Sequential Unlocking Chain: Problem 1 is always unlocked.
                // Each next problem requires the previous problem to be 100% completed.
                let canUnlockNext = true;

                probList.forEach((p, idx) => {
                  const problemID = p.id;
                  const rawNum = p.rawNum;
                  const badgeNum = rawNum < 10 ? `0${rawNum}` : `${rawNum}`;
                  const title = getProblemDisplayName(category, problemID, p.val);

                  let progress = 0;
                  if (userProgress[category] && userProgress[category][problemID]) {
                    progress = userProgress[category][problemID].progress || 0;
                  }
                  if (uid && localStorage.getItem(`ctc_compiler_executed_${uid}_${problemID}`) === 'true') {
                    progress = 100;
                  }

                  const isCompleted = progress === 100 || isProblemDone(category, problemID);
                  const stateClass = isCompleted ? "completed" : (progress > 0 ? "ongoing" : "");
                  const offset = 251.2 - (251.2 * progress / 100);

                  let prevProbTitle = "";
                  if (idx > 0) {
                    const prevP = probList[idx - 1];
                    prevProbTitle = getProblemDisplayName(category, prevP.id, prevP.val);
                  }

                  // Strict Sequential Rule: Problem 1 is always unlocked.
                  // Problem 21 and Problem 22 are also unlocked directly.
                  // Subsequent problems unlock ONLY IF the sequential chain is unbroken (all prior problems completed).
                  let isUnlocked = (idx === 0) || canUnlockNext || (problemID === 'problem21' || rawNum === 21) || (problemID === 'problem22' || rawNum === 22);

                  // If this problem is not completed, break the sequential chain for all subsequent problems
                  if (!isCompleted) {
                    canUnlockNext = false;
                  }

                  let cardHTML = "";
                  if (isUnlocked) {
                    cardHTML = `
                      <div class="card ${stateClass} animate-on-scroll">
                        <span class="card-badge">Problem ${badgeNum}</span>
                        <div style="font-weight: 700; font-size: 14.5px; color: #1e293b; margin: 10px 0 6px; text-align: center; min-height: 42px; display: flex; align-items: center; justify-content: center; line-height: 1.35; padding: 0 4px;">
                          ${title}
                        </div>
                        <div class="progress-container">
                          <svg class="progress-svg" viewBox="0 0 100 100">
                            <circle class="progress-bg" cx="50" cy="50" r="40"></circle>
                            <circle class="progress-bar" cx="50" cy="50" r="40" style="stroke-dashoffset:${offset}"></circle>
                          </svg>
                          <div class="progress-text">
                            <span class="value">${isCompleted ? "<i class='fas fa-check'></i>" : progress}</span>
                            <span class="percent">${isCompleted ? "" : "%"}</span>
                          </div>
                        </div>
                        <a href="tryctc.html?category=${encodeURIComponent(category)}&problemID=${encodeURIComponent(problemID)}" class="btn">
                          ${isCompleted ? "Review Solution" : (progress > 0 ? "Continue Challenge" : "Enter Challenge")}
                        </a>
                      </div>
                    `;
                  } else {
                    cardHTML = `
                      <div class="card locked-card animate-on-scroll">
                        <span class="card-badge"><i class="fas fa-lock" style="font-size: 10px; margin-right: 4px;"></i> Problem ${badgeNum}</span>
                        <div style="font-weight: 700; font-size: 14.5px; color: #64748b; margin: 10px 0 6px; text-align: center; min-height: 42px; display: flex; align-items: center; justify-content: center; line-height: 1.35; padding: 0 4px;">
                          ${title}
                        </div>
                        <div class="progress-container">
                          <svg class="progress-svg" viewBox="0 0 100 100">
                            <circle class="progress-bg" cx="50" cy="50" r="40"></circle>
                            <circle class="progress-bar" cx="50" cy="50" r="40" style="stroke-dashoffset: 251.2;"></circle>
                          </svg>
                          <div class="progress-text">
                            <span class="value"><i class="fas fa-lock" style="color: #94a3b8; font-size: 1.3rem;"></i></span>
                            <span class="percent"></span>
                          </div>
                        </div>
                        <button type="button" onclick="showLockedToast('${title.replace(/'/g, "\\'")}', '${prevProbTitle.replace(/'/g, "\\'")}')" class="btn btn-locked">
                          <i class="fas fa-lock"></i> Locked
                        </button>
                      </div>
                    `;
                  }

                  if (containers[category]) {
                    containers[category].innerHTML += cardHTML;
                    renderedAny = true;
                  }
                });
              });
            }

            // Fallback: If Firebase programs are empty or fewer, render all 21 programs in fundamentals with sequential unlock
            if (!renderedAny && containers.fundamentals) {
              let canUnlockNext = true;
              FALLBACK_PROGRAMS.forEach((p, idx) => {
                const category = p.category;
                const problemID = p.id;
                let progress = 0;
                if (userProgress[category] && userProgress[category][problemID]) {
                  progress = userProgress[category][problemID].progress || 0;
                }
                if (uid && localStorage.getItem(`ctc_compiler_executed_${uid}_${problemID}`) === 'true') {
                  progress = 100;
                }
                const isCompleted = progress === 100 || isProblemDone(category, problemID);
                const stateClass = isCompleted ? "completed" : (progress > 0 ? "ongoing" : "");
                const offset = 251.2 - (251.2 * progress / 100);

                let prevProbTitle = "";
                if (idx > 0) {
                  const prevP = FALLBACK_PROGRAMS[idx - 1];
                  prevProbTitle = prevP.title;
                }

                // Strict Sequential Rule: Problem 1 is always unlocked. Problem 21 & Problem 22 are also unlocked directly.
                let isUnlocked = (idx === 0) || canUnlockNext || (p.id === 'problem21' || p.num == 21) || (p.id === 'problem22' || p.num == 22);

                if (!isCompleted) {
                  canUnlockNext = false;
                }

                let cardHTML = "";
                if (isUnlocked) {
                  cardHTML = `
                    <div class="card ${stateClass} animate-on-scroll">
                      <span class="card-badge">Problem ${parseInt(p.num, 10) < 10 ? '0' + parseInt(p.num, 10) : p.num}</span>
                      <div style="font-weight: 700; font-size: 14.5px; color: #1e293b; margin: 10px 0 6px; text-align: center; min-height: 42px; display: flex; align-items: center; justify-content: center; line-height: 1.35; padding: 0 4px;">
                        ${p.title}
                      </div>
                      <div class="progress-container">
                        <svg class="progress-svg" viewBox="0 0 100 100">
                          <circle class="progress-bg" cx="50" cy="50" r="40"></circle>
                          <circle class="progress-bar" cx="50" cy="50" r="40" style="stroke-dashoffset:${offset}"></circle>
                        </svg>
                        <div class="progress-text">
                          <span class="value">${isCompleted ? "<i class='fas fa-check'></i>" : progress}</span>
                          <span class="percent">${isCompleted ? "" : "%"}</span>
                        </div>
                      </div>
                      <a href="tryctc.html?category=${encodeURIComponent(category)}&problemID=${encodeURIComponent(problemID)}" class="btn">
                        ${isCompleted ? "Review Solution" : (progress > 0 ? "Continue Challenge" : "Enter Challenge")}
                      </a>
                    </div>
                  `;
                } else {
                  cardHTML = `
                    <div class="card locked-card animate-on-scroll">
                      <span class="card-badge"><i class="fas fa-lock" style="font-size: 10px; margin-right: 4px;"></i> Problem ${parseInt(p.num, 10) < 10 ? '0' + parseInt(p.num, 10) : p.num}</span>
                      <div style="font-weight: 700; font-size: 14.5px; color: #64748b; margin: 10px 0 6px; text-align: center; min-height: 42px; display: flex; align-items: center; justify-content: center; line-height: 1.35; padding: 0 4px;">
                        ${p.title}
                      </div>
                      <div class="progress-container">
                        <svg class="progress-svg" viewBox="0 0 100 100">
                          <circle class="progress-bg" cx="50" cy="50" r="40"></circle>
                          <circle class="progress-bar" cx="50" cy="50" r="40" style="stroke-dashoffset: 251.2;"></circle>
                        </svg>
                        <div class="progress-text">
                          <span class="value"><i class="fas fa-lock" style="color: #94a3b8; font-size: 1.3rem;"></i></span>
                          <span class="percent"></span>
                        </div>
                      </div>
                      <button type="button" onclick="showLockedToast('${p.title.replace(/'/g, "\\'")}', '${prevProbTitle.replace(/'/g, "\\'")}')" class="btn btn-locked">
                        <i class="fas fa-lock"></i> Locked
                      </button>
                    </div>
                  `;
                }
                containers.fundamentals.innerHTML += cardHTML;
              });
            }

            initAnimations();
          } catch (err) {
            console.error("Dashboard Load Error:", err);
            // Even on error, render all 21 fallback programs safely without cross-user leakage
            if (containers.fundamentals) {
              containers.fundamentals.innerHTML = "";
              const FALLBACK_PROGRAMS = [
                { id: "problem01", num: "1", title: "Odd or Even", category: "fundamentals" },
                { id: "problem02", num: "2", title: "Sum of N Numbers", category: "fundamentals" },
                { id: "problem03", num: "3", title: "Factorial of a Number", category: "fundamentals" },
                { id: "problem04", num: "4", title: "Divisors of a Number", category: "fundamentals" },
                { id: "problem05", num: "5", title: "Multiplication Table", category: "fundamentals" },
                { id: "problem06", num: "6", title: "Prime Number Checker", category: "fundamentals" },
                { id: "problem07", num: "7", title: "Next Prime Number", category: "fundamentals" },
                { id: "problem08", num: "8", title: "Prime Numbers in Range", category: "fundamentals" },
                { id: "problem09", num: "9", title: "Sexy Prime Pairs", category: "fundamentals" },
                { id: "problem10", num: "10", title: "Positive or Negative", category: "fundamentals" },
                { id: "problem11", num: "11", title: "Three-Digit Number", category: "fundamentals" },
                { id: "problem12", num: "12", title: "Voting Eligibility", category: "fundamentals" },
                { id: "problem13", num: "13", title: "Pass or Fail", category: "fundamentals" },
                { id: "problem14", num: "14", title: "Greater Than 100", category: "fundamentals" },
                { id: "problem15", num: "15", title: "Profit or Loss", category: "fundamentals" },
                { id: "problem16", num: "16", title: "Leap Year or Not", category: "fundamentals" },
                { id: "problem17", num: "17", title: "Adult or Minor", category: "fundamentals" },
                { id: "problem18", num: "18", title: "Divisible by 5 or Not", category: "fundamentals" },
                { id: "problem19", num: "19", title: "Maximum of Two Numbers", category: "fundamentals" },
                { id: "problem20", num: "20", title: "Vowel or Consonant", category: "fundamentals" },
                { id: "problem21", num: "21", title: "Print Even Numbers from 1 to 50", category: "fundamentals" },
                { id: "problem22", num: "22", title: "Print Odd Numbers from 1 to 50", category: "fundamentals" }
              ];
              let canUnlockNext = true;
              FALLBACK_PROGRAMS.forEach((p, idx) => {
                let progress = 0;
                if (userProgress && userProgress[p.category] && userProgress[p.category][p.id]) {
                  progress = userProgress[p.category][p.id].progress || 0;
                }
                if (uid && localStorage.getItem(`ctc_compiler_executed_${uid}_${p.id}`) === 'true') {
                  progress = 100;
                }
                const isCompleted = progress === 100 || (userProgress && userProgress[p.category] && userProgress[p.category][p.id] && (userProgress[p.category][p.id].progress === 100 || userProgress[p.category][p.id].status === 'completed'));
                const isUnlocked = (idx === 0) || canUnlockNext || (p.id === 'problem21' || p.num == 21) || (p.id === 'problem22' || p.num == 22);
                if (!isCompleted) canUnlockNext = false;
                const prevTitle = idx === 0 ? "" : FALLBACK_PROGRAMS[idx-1].title;
                const pNum = parseInt(p.num, 10) < 10 ? '0' + parseInt(p.num, 10) : p.num;

                if (isUnlocked) {
                  containers.fundamentals.innerHTML += `
                    <div class="card animate-on-scroll">
                      <span class="card-badge">Problem ${pNum}</span>
                      <div style="font-weight: 700; font-size: 14.5px; color: #1e293b; margin: 10px 0 6px; text-align: center; min-height: 42px; display: flex; align-items: center; justify-content: center; line-height: 1.35; padding: 0 4px;">
                        ${p.title}
                      </div>
                      <div class="progress-container">
                        <svg class="progress-svg" viewBox="0 0 100 100"><circle class="progress-bg" cx="50" cy="50" r="40"></circle></svg>
                        <div class="progress-text"><span class="value">${progress}</span><span class="percent">%</span></div>
                      </div>
                      <a href="tryctc.html?category=fundamentals&problemID=${p.id}" class="btn">${isCompleted ? "Review Solution" : (progress > 0 ? "Continue Challenge" : "Enter Challenge")}</a>
                    </div>
                  `;
                } else {
                  containers.fundamentals.innerHTML += `
                    <div class="card locked-card animate-on-scroll">
                      <span class="card-badge"><i class="fas fa-lock" style="font-size: 10px; margin-right: 4px;"></i> Problem ${pNum}</span>
                      <div style="font-weight: 700; font-size: 14.5px; color: #64748b; margin: 10px 0 6px; text-align: center; min-height: 42px; display: flex; align-items: center; justify-content: center; line-height: 1.35; padding: 0 4px;">
                        ${p.title}
                      </div>
                      <div class="progress-container">
                        <svg class="progress-svg" viewBox="0 0 100 100"><circle class="progress-bg" cx="50" cy="50" r="40"></circle></svg>
                        <div class="progress-text"><span class="value"><i class="fas fa-lock" style="color: #94a3b8; font-size: 1.3rem;"></i></span></div>
                      </div>
                      <button type="button" onclick="showLockedToast('${p.title.replace(/'/g, "\\'")}', '${prevTitle.replace(/'/g, "\\'")}')" class="btn btn-locked">
                        <i class="fas fa-lock"></i> Locked
                      </button>
                    </div>
                  `;
                }
              });
              initAnimations();
            }
          }
        }

        // Modal Utility
        window.showModal = function (msg, type = 'success') {
          const modal = document.getElementById('statusModal');
          const icon = document.getElementById('modalIcon');
          const title = document.getElementById('modalTitle');
          const message = document.getElementById('modalMessage');

          message.textContent = msg;

          if (type === 'error' || type === 'warning') {
            icon.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
            icon.style.color = '#ef4444';
            icon.style.backgroundColor = '#fef2f2';
            title.textContent = 'Action Required';
          } else {
            icon.innerHTML = '<i class="fas fa-check-circle"></i>';
            icon.style.color = '#10b981';
            icon.style.backgroundColor = '#ecfdf5';
            title.textContent = 'Success!';
          }
          modal.classList.add('active');
        };

        window.closeModal = function () {
          document.getElementById('statusModal').classList.remove('active');
        };

        // Auth Enforcement: redirect unauthenticated users to newuser landing page
        if (!uid || uid === "guest_user") {
          window.location.href = "newuser.html";
        } else {
          loadDashboardData();
        }

        /* TOAST & LOCK NOTIFICATIONS */
        window.showToast = function (message, type = "info") {
          let container = document.getElementById("toastContainer");
          if (!container) {
            container = document.createElement("div");
            container.id = "toastContainer";
            container.style.cssText = "position: fixed; bottom: 24px; right: 24px; z-index: 99999; display: flex; flex-direction: column; gap: 10px; max-width: 380px;";
            document.body.appendChild(container);
          }
          const toast = document.createElement("div");
          toast.className = `toast toast-${type}`;
          const accentColor = type === 'warning' ? '#f59e0b' : (type === 'error' ? '#ef4444' : '#3a86cc');
          toast.style.cssText = `background: #0f172a; color: #ffffff; border-left: 4px solid ${accentColor}; padding: 12px 18px; border-radius: 10px; font-size: 13.5px; font-weight: 600; box-shadow: 0 10px 25px rgba(0,0,0,0.3); display: flex; align-items: center; gap: 10px; animation: slideInRight 0.3s ease;`;
          toast.innerHTML = `<i class="fas ${type === 'warning' ? 'fa-lock' : 'fa-info-circle'}" style="color:${accentColor}; font-size: 15px;"></i> <span>${message}</span>`;
          container.appendChild(toast);
          setTimeout(() => {
            toast.style.opacity = '0';
            toast.style.transform = 'translateY(10px)';
            toast.style.transition = 'all 0.3s ease';
            setTimeout(() => toast.remove(), 300);
          }, 3500);
        };

        window.showLockedToast = function (title, prevTitle) {
          showToast(`🔒 ${title} is locked! Complete ${prevTitle || "the previous problem"} to unlock this challenge.`, 'warning');
        };

        /* GLOBAL HELPER FUNCTIONS */
        window.openProblem = (cat, id) => {
          window.location.href = `tryctc.html?category=${encodeURIComponent(cat)}&problemID=${encodeURIComponent(id)}`;
        };

        window.logoutUser = () => {
          localStorage.clear();
          window.location.href = "newuser.html";
        };

        // Dropdown
        document.getElementById('avatarBtn').addEventListener('click', (e) => {
          e.stopPropagation();
          document.getElementById('dropdownMenu').classList.toggle('active');
        });

        document.addEventListener('click', (e) => {
          const dropdown = document.getElementById('dropdownMenu');
          if (dropdown && !dropdown.contains(e.target) && !e.target.closest('#avatarBtn')) {
            dropdown.classList.remove('active');
          }
        });

        const observer = new IntersectionObserver((entries) => {
          entries.forEach(entry => {
            if (entry.isIntersecting) {
              entry.target.classList.add('is-visible');
              observer.unobserve(entry.target);
            }
          });
        }, { threshold: 0.1 });

        function initAnimations() {
          document.querySelectorAll('.animate-on-scroll').forEach(el => observer.observe(el));
        }
      </script>
    </div>
  </div>
  <!-- Professional Status Modal -->
  <div id="statusModal" class="modal-overlay">
    <div class="modal-content">
      <div id="modalIcon" class="modal-icon">
        <i class="fas fa-check-circle"></i>
      </div>
      <h3 id="modalTitle" class="modal-title">Success!</h3>
      <p id="modalMessage" class="modal-message">Your progress has been saved.</p>
      <button class="modal-btn" onclick="closeModal()">Continue</button>
    </div>
  </div>
</body>

</html>
