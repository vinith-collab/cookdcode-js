<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Edit Profile - CookDCode</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.2/css/all.min.css" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  <link rel="stylesheet" href="../css/edit-profile.css" />
  <link rel="stylesheet" href="../css/dashboard.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script src="../public/js/tamilNaduSchoolsData.js"></script>
  <style>
    .cropper-view-box, .cropper-face {
      border-radius: 50%;
    }
  </style>
</head>

<body>
  <div class="dashboard-layout">
    <!-- Sidebar -->
    <aside class="sidebar" id="sidebar">
      <nav class="sidebar-nav">
        <a href="ctc.html" class="sidebar-link">
          <i class="fas fa-th-large"></i>
          <span>Dashboard</span>
        </a>
        <a href="ongoingprograms.html" class="sidebar-link">
          <i class="fas fa-spinner fa-spin-hover"></i>
          <span>Ongoing Programs</span>
        </a>
        <a href="completed-programs.html" class="sidebar-link">
          <i class="fas fa-check-circle"></i>
          <span>Completed Programs</span>
        </a>
        <a href="leaderboard.html" class="sidebar-link">
          <i class="fas fa-trophy"></i>
          <span>Leaderboard</span>
        </a>
        

      </nav>
      
    </aside>

    <!-- Main Content Area -->
    <div class="main-content">
      <nav class="navbar">
        <div class="nav-left" style="display: flex; align-items: center; gap: 1rem;">
          <button class="mobile-toggle" id="mobileToggle" aria-label="Toggle Menu" style="display: none;">
            <i class="fas fa-bars"></i>
          </button>
          <a href="ctc.html" class="btn-back" title="Back to Dashboard">
            <i class="fas fa-arrow-left"></i>
          </a>
          <a href="ctc.html" class="brand">
            <img src="../Images/logo.png" alt="cookDcode Logo" class="logo" />
            <span>cookDcode</span>
          </a>
        </div>

        <div class="navbar-right"></div>
      </nav>

  <main>
    <div class="profile-container">
      <form id="profileForm" class="profile-card">

        <div class="form-content">
          <div class="profile-title">
            <h2>Public Profile</h2>
          </div>

          <!-- Avatar Section -->
          <div class="avatar-section">
            <div class="avatar-container">
              <img src="https://ui-avatars.com/api/?name=U&background=3a86cc&color=fff&rounded=true&size=256"
                alt="Avatar" class="avatar-img" id="avatarPreview" />
              <div class="avatar-edit-btn" title="Change Avatar">
                <i class="fas fa-pencil-alt" style="font-size: 0.75rem;"></i>
                <input type="file" id="avatarFile" accept="image/*" />
              </div>
            </div>
            <div class="avatar-info">
              <h3>Profile Picture</h3>
              <p>PNG, JPEG under 15MB</p>
            </div>
          </div>

          <!-- Form Fields -->
          <div class="form-grid">
            <div class="form-group full">
              <label for="name">Full Name</label>
              <input type="text" id="name" placeholder="e.g. Jane Doe" required />
            </div>

            <div class="form-group">
              <label for="phone">Phone Number</label>
              <input type="tel" id="phone" placeholder="+1 (555) 000-0000" required />
            </div>

            <div class="form-group">
              <label for="age">Age</label>
              <input type="number" id="age" min="1" max="120" placeholder="e.g. 25" required />
            </div>

            <div class="form-group">
              <label for="districtSelect">District (Tamil Nadu)</label>
              <select id="districtSelect" style="background: var(--input-bg); padding: 0.875rem 1rem; border-radius: 0.75rem; border: 1px solid transparent; font-size: 0.95rem; cursor: pointer;" required>
                <option value="" disabled selected>Select District</option>
                <option value="Ariyalur">Ariyalur</option>
                <option value="Chengalpattu">Chengalpattu</option>
                <option value="Chennai">Chennai</option>
                <option value="Coimbatore">Coimbatore</option>
                <option value="Cuddalore">Cuddalore</option>
                <option value="Dharmapuri">Dharmapuri</option>
                <option value="Dindigul">Dindigul</option>
                <option value="Erode">Erode</option>
                <option value="Kallakurichi">Kallakurichi</option>
                <option value="Kanchipuram">Kanchipuram</option>
                <option value="Kanyakumari">Kanyakumari</option>
                <option value="Karur">Karur</option>
                <option value="Krishnagiri">Krishnagiri</option>
                <option value="Madurai">Madurai</option>
                <option value="Mayiladuthurai">Mayiladuthurai</option>
                <option value="Nagapattinam">Nagapattinam</option>
                <option value="Namakkal">Namakkal</option>
                <option value="Nilgiris">Nilgiris</option>
                <option value="Perambalur">Perambalur</option>
                <option value="Pudukkottai">Pudukkottai</option>
                <option value="Ramanathapuram">Ramanathapuram</option>
                <option value="Ranipet">Ranipet</option>
                <option value="Salem">Salem</option>
                <option value="Sivaganga">Sivaganga</option>
                <option value="Tenkasi">Tenkasi</option>
                <option value="Thanjavur">Thanjavur</option>
                <option value="Theni">Theni</option>
                <option value="Thoothukudi">Thoothukudi</option>
                <option value="Tiruchirappalli (Trichy)">Tiruchirappalli (Trichy)</option>
                <option value="Tirunelveli">Tirunelveli</option>
                <option value="Tirupathur">Tirupathur</option>
                <option value="Tiruppur">Tiruppur</option>
                <option value="Tiruvallur">Tiruvallur</option>
                <option value="Tiruvannamalai">Tiruvannamalai</option>
                <option value="Tiruvarur">Tiruvarur</option>
                <option value="Vellore">Vellore</option>
                <option value="Viluppuram">Viluppuram</option>
                <option value="Virudhunagar">Virudhunagar</option>
              </select>
            </div>

            <div class="form-group">
              <label for="gradeSelect">Grade / Standard</label>
              <select id="gradeSelect" style="background: var(--input-bg); padding: 0.875rem 1rem; border-radius: 0.75rem; border: 1px solid transparent; font-size: 0.95rem; cursor: pointer;">
                <option value="">Select Grade</option>
                <option value="6th Standard">6th Standard</option>
                <option value="7th Standard">7th Standard</option>
                <option value="8th Standard">8th Standard</option>
                <option value="9th Standard">9th Standard</option>
                <option value="10th Standard">10th Standard</option>
                <option value="11th Standard">11th Standard</option>
                <option value="12th Standard">12th Standard</option>
                <option value="Other">Other</option>
              </select>
            </div>

            <div class="form-group full">
              <label for="schoolSelect">School / Institute Name</label>
              <select id="schoolSelect" style="background: var(--input-bg); padding: 0.875rem 1rem; border-radius: 0.75rem; border: 1px solid transparent; font-size: 0.95rem; cursor: pointer;" required>
                <option value="" disabled selected>Select District First</option>
              </select>
            </div>

            <div class="form-group full" id="customSchoolContainer" style="display: none;">
              <label for="customSchoolInput">Specify School Name (if not in list)</label>
              <input type="text" id="customSchoolInput" placeholder="Type your school / institute name" />
            </div>

            <div class="form-group full">
              <label for="education">Education / Degree</label>
              <input type="text" id="education" placeholder="e.g. High School / Higher Secondary" />
            </div>
          </div>
        </div>

        <!-- Footer Actions -->
        <div class="form-footer" id="formFooter">
          <!-- Default State: Edit Button -->
          <button type="button" id="editBtn" class="btn-save" onclick="startEditing()">Edit Profile</button>

          <!-- Editing State: Cancel & Save (Hidden by default) -->
          <button type="button" id="cancelBtn" class="btn-cancel" onclick="revertChanges()"
            style="display: none;">Cancel</button>
          <button type="submit" id="saveBtn" class="btn-save" style="display: none;">Save changes</button>
        </div>

      </form>
    </div>

    <!-- Cropper Modal -->
    <div id="cropperModal" class="modal-overlay">
      <div class="modal-content" style="max-width: 500px; padding: 1.5rem; text-align: center;">
        <h3 class="modal-title" style="margin-bottom: 1rem;">Crop Profile Picture</h3>
        <p style="color: #64748b; font-size: 0.9rem; margin-bottom: 1rem;">Position and scale image inside the circle to center your face.</p>
        <div style="width: 100%; height: 350px; overflow: hidden; margin-bottom: 1.5rem; border-radius: 8px; background: rgba(0,0,0,0.05); display: flex; align-items: center; justify-content: center;">
          <img id="cropperImage" src="" style="max-width: 100%; max-height: 100%; display: block;">
        </div>
        <div style="display: flex; gap: 1rem; justify-content: center;">
          <button type="button" class="btn-cancel" onclick="closeCropperModal()" style="padding: 0.75rem 1.5rem; font-weight: 600; border-radius: 8px; cursor: pointer; border: 1px solid #ccc;">Cancel</button>
          <button type="button" class="btn-save" id="btnCrop" style="padding: 0.75rem 1.5rem; font-weight: 600; border-radius: 8px; cursor: pointer;">Confirm Crop</button>
        </div>
      </div>
    </div>

    <!-- Professional Status Modal -->
    <div id="statusModal" class="modal-overlay">
      <div class="modal-content">
        <div id="modalIcon" class="modal-icon">
          <i class="fas fa-check-circle"></i>
        </div>
        <h3 id="modalTitle" class="modal-title">Success!</h3>
        <p id="modalMessage" class="modal-message">Profile Updated Successfully</p>
        <button class="modal-btn" onclick="closeModal()">Continue</button>
      </div>
    </div>
  </main>

  <script>
    // Avatar preview logic
    const avatarFileInput = document.getElementById('avatarFile');
    const avatarPreview = document.getElementById('avatarPreview');
    let cropper = null;
    let croppedImageBase64 = null;

    avatarFileInput.addEventListener('change', function (e) {
      const file = e.target.files[0];
      if (file) {
        const reader = new FileReader();
        reader.onload = function (event) {
          const cropperImage = document.getElementById('cropperImage');
          cropperImage.src = event.target.result;
          
          document.getElementById('cropperModal').classList.add('active');
          
          if (cropper) cropper.destroy();
          cropper = new Cropper(cropperImage, {
            aspectRatio: 1,
            viewMode: 1,
            dragMode: 'move',
            autoCropArea: 1,
            restore: false,
            guides: false,
            center: true,
            highlight: false,
            cropBoxMovable: false,
            cropBoxResizable: false,
            toggleDragModeOnDblclick: false,
            minContainerHeight: 350,
          });
        };
        reader.readAsDataURL(file);
      }
    });

    window.closeCropperModal = function() {
      document.getElementById('cropperModal').classList.remove('active');
      if (cropper) {
        cropper.destroy();
        cropper = null;
      }
      avatarFileInput.value = ''; // Allow re-selecting same file
    };

    document.getElementById('btnCrop').addEventListener('click', function() {
      if (!cropper) return;
      
      const canvas = cropper.getCroppedCanvas({
        width: 300,
        height: 300,
      });
      
      const croppedBase64 = canvas.toDataURL('image/jpeg', 0.9);
      croppedImageBase64 = croppedBase64;
      window.croppedImageBase64 = croppedBase64;
      avatarPreview.src = croppedBase64;
      
      closeCropperModal();
    });

    // Modal utility
    window.showModal = function (msg, type = 'success') {
      const modal = document.getElementById('statusModal');
      const icon = document.getElementById('modalIcon');
      const title = document.getElementById('modalTitle');
      const message = document.getElementById('modalMessage');

      message.textContent = msg;

      if (type === 'error') {
        icon.innerHTML = '<i class="fas fa-exclamation-triangle"></i>';
        icon.style.color = '#ef4444';
        icon.style.backgroundColor = '#fef2f2';
        title.textContent = 'Oops!';
      } else {
        icon.innerHTML = '<i class="fas fa-check-circle"></i>';
        icon.style.color = '#10b981';
        icon.style.backgroundColor = '#ecfdf5';
        title.textContent = 'Success!';
      }

      modal.classList.add('active');
    };

    window.closeModal = function () {
      document.getElementById('statusModal').classList.remove('active');
    };
  </script>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-app.js";
    import { getDatabase, ref, get, update } from "https://www.gstatic.com/firebasejs/10.7.1/firebase-database.js";

    const firebaseConfig = {
      apiKey: "AIzaSyBoAb7b3DJDMRmNwOSAHTnscM_-JuVnILI",
      authDomain: "cookdcode-4ce23.firebaseapp.com",
      databaseURL: "https://cookdcode-4ce23-default-rtdb.firebaseio.com",
      projectId: "cookdcode-4ce23",
      storageBucket: "cookdcode-4ce23.firebasestorage.app",
      messagingSenderId: "419836764054",
      appId: "1:419836764054:web:ab9968082fb793029f07b7"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const uid = localStorage.getItem("userId") || localStorage.getItem("uid");
    let originalData = {};
    let userRef = null;

    function setFieldsDisabled(disabled) {
      const inputs = document.querySelectorAll('.form-grid input, .form-grid select');
      inputs.forEach(input => input.disabled = disabled);
      const avatarInput = document.getElementById('avatarFile');
      if (avatarInput) avatarInput.disabled = disabled;

      const editBtn = document.getElementById('editBtn');
      const cancelBtn = document.getElementById('cancelBtn');
      const saveBtn = document.getElementById('saveBtn');

      if (editBtn) editBtn.style.display = disabled ? 'block' : 'none';
      if (cancelBtn) cancelBtn.style.display = disabled ? 'none' : 'block';
      if (saveBtn) saveBtn.style.display = disabled ? 'none' : 'block';
    }

    function setNavigationLocked(locked) {
      document.querySelectorAll('.btn-back, .brand').forEach(el => {
        el.style.pointerEvents = locked ? 'none' : 'auto';
      });
      const backIcon = document.querySelector('.btn-back i');
      if (backIcon) {
        backIcon.style.opacity = locked ? '0.3' : '1';
      }
    }

    const districtSelect = document.getElementById("districtSelect");
    const schoolSelect = document.getElementById("schoolSelect");
    const customSchoolContainer = document.getElementById("customSchoolContainer");
    const customSchoolInput = document.getElementById("customSchoolInput");

    function initDistrictDropdown() {
      const districtsData = window.TAMIL_NADU_DISTRICTS_DATA || {};
      const districts = Object.keys(districtsData).sort();
      if (districtSelect && districtSelect.options.length <= 1) {
        districts.forEach(d => {
          const opt = document.createElement("option");
          opt.value = d;
          opt.textContent = d;
          districtSelect.appendChild(opt);
        });
      }
    }

    function populateSchoolsForDistrict(dist, selectedSchool) {
      const districtsData = window.TAMIL_NADU_DISTRICTS_DATA || {};
      if (!schoolSelect) return;

      schoolSelect.innerHTML = "";
      if (!dist || !districtsData[dist]) {
        schoolSelect.disabled = true;
        const opt = document.createElement("option");
        opt.value = "";
        opt.textContent = "Select District First";
        opt.disabled = true;
        opt.selected = true;
        schoolSelect.appendChild(opt);
        if (customSchoolContainer) customSchoolContainer.style.display = "none";
        return;
      }

      schoolSelect.disabled = false;
      const defOpt = document.createElement("option");
      defOpt.value = "";
      defOpt.textContent = `Select School in ${dist}`;
      defOpt.disabled = true;
      schoolSelect.appendChild(defOpt);

      const schools = (districtsData[dist] || []).slice().sort((a, b) => a.localeCompare(b));
      let isKnown = false;
      schools.forEach(sch => {
        const opt = document.createElement("option");
        opt.value = sch;
        opt.textContent = sch;
        if (selectedSchool && selectedSchool === sch) {
          opt.selected = true;
          isKnown = true;
        }
        schoolSelect.appendChild(opt);
      });

      const otherOpt = document.createElement("option");
      otherOpt.value = "OTHER_CUSTOM";
      otherOpt.textContent = "➕ Other School (Type your school name)";
      if (selectedSchool && !isKnown) {
        otherOpt.selected = true;
        if (customSchoolContainer) customSchoolContainer.style.display = "block";
        if (customSchoolInput) customSchoolInput.value = selectedSchool;
      }
      schoolSelect.appendChild(otherOpt);

      if (!selectedSchool) {
        defOpt.selected = true;
      }
    }

    if (districtSelect) {
      districtSelect.addEventListener("change", function () {
        populateSchoolsForDistrict(this.value, "");
      });
    }

    if (schoolSelect) {
      schoolSelect.addEventListener("change", function () {
        if (this.value === "OTHER_CUSTOM") {
          if (customSchoolContainer) customSchoolContainer.style.display = "block";
          if (customSchoolInput) customSchoolInput.focus();
        } else {
          if (customSchoolContainer) customSchoolContainer.style.display = "none";
          if (customSchoolInput) customSchoolInput.value = "";
        }
      });
    }

    function updateFieldValues(data) {
      if (!data) return;
      initDistrictDropdown();

      const computedName = data.fullname || (data.firstname ? (data.firstname + (data.lastname ? " " + data.lastname : "")).trim() : "");
      document.getElementById("name").value = computedName;
      document.getElementById("phone").value = data.phone || localStorage.getItem("userPhone") || "";
      document.getElementById("age").value = data.age || "";
      document.getElementById("education").value = data.education || "";

      const userDist = data.district || localStorage.getItem("userDistrict") || "";
      const userSch = data.schoolName || data.instituteName || localStorage.getItem("userSchool") || "";
      const userGrd = data.grade || data.standard || localStorage.getItem("userGrade") || "";

      if (districtSelect) districtSelect.value = userDist;
      if (document.getElementById("gradeSelect")) document.getElementById("gradeSelect").value = userGrd;

      populateSchoolsForDistrict(userDist, userSch);

      if (data.profileImage) {
        const preview = document.getElementById("avatarPreview");
        if (preview) preview.src = data.profileImage;
      }
    }

    window.startEditing = function () {
      setFieldsDisabled(false);
    };

    window.revertChanges = function () {
      updateFieldValues(originalData);
      setFieldsDisabled(true);
    };

    // Attach listeners directly to buttons as well
    const editBtnEl = document.getElementById('editBtn');
    if (editBtnEl) {
      editBtnEl.addEventListener('click', () => setFieldsDisabled(false));
    }

    const cancelBtnEl = document.getElementById('cancelBtn');
    if (cancelBtnEl) {
      cancelBtnEl.addEventListener('click', () => {
        updateFieldValues(originalData);
        setFieldsDisabled(true);
      });
    }

    async function initProfile() {
      if (!uid || uid === "guest_user") {
        showModal("User session expired. Please log in again.", "error");
        setTimeout(() => { window.location.href = "login.html"; }, 1500);
        return;
      }

      userRef = ref(db, "users/" + uid);

      try {
        const snapshot = await get(userRef);
        if (snapshot.exists()) {
          const data = snapshot.val();
          originalData = { ...data };

          updateFieldValues(data);

          const tokenCountEl = document.getElementById("tokenCount");
          if (tokenCountEl && data.tokens !== undefined) {
            tokenCountEl.textContent = data.tokens;
          }

          const hasBasicInfo = (data.fullname || data.firstname) && data.phone;
          const isComplete = hasBasicInfo && data.age && (data.schoolName || data.instituteName);

          if (!isComplete) {
            // Incomplete profile (e.g. existing user without schoolName): allow editing immediately
            setFieldsDisabled(false);
          } else {
            // Already complete: start in view mode
            setFieldsDisabled(true);
          }
        } else {
          // New record: enable inputs
          setFieldsDisabled(false);
        }
      } catch (err) {
        console.warn("RTDB load warning:", err);
        setFieldsDisabled(false);
      }
    }

    initProfile();

    /* UPDATE PROFILE */
    const profileForm = document.getElementById("profileForm");
    if (profileForm) {
      profileForm.addEventListener("submit", async (e) => {
        e.preventDefault();

        if (!userRef) {
          if (!uid || uid === "guest_user") {
            showModal("Please log in to save your profile.", "error");
            return;
          }
          userRef = ref(db, "users/" + uid);
        }

        const name = document.getElementById("name").value.trim();
        const phone = document.getElementById("phone").value.trim();
        const age = document.getElementById("age").value.trim();
        const district = districtSelect ? districtSelect.value.trim() : "";
        const rawSchool = schoolSelect ? schoolSelect.value.trim() : "";
        const customSchool = customSchoolInput ? customSchoolInput.value.trim() : "";
        const grade = document.getElementById("gradeSelect") ? document.getElementById("gradeSelect").value.trim() : "";
        const education = document.getElementById("education").value.trim();

        const finalSchoolName = rawSchool === "OTHER_CUSTOM" ? customSchool : rawSchool;

        if (!district) {
          showModal("Please select your District in Tamil Nadu.", "error");
          districtSelect?.focus();
          return;
        }

        if (!finalSchoolName) {
          showModal("Please select or enter your School / Institute Name.", "error");
          if (rawSchool === "OTHER_CUSTOM") {
            customSchoolInput?.focus();
          } else {
            schoolSelect?.focus();
          }
          return;
        }

        try {
          const nameParts = name.split(/\s+/);
          const firstname = nameParts[0] || name;
          const lastname = nameParts.slice(1).join(" ") || "";

          const updateData = {
            fullname: name,
            firstname: firstname,
            lastname: lastname,
            phone: phone,
            age: age,
            district: district,
            state: "Tamil Nadu",
            schoolName: finalSchoolName,
            grade: grade,
            education: education
          };

          const imageToSave = window.croppedImageBase64 || croppedImageBase64;
          if (imageToSave) {
            updateData.profileImage = imageToSave;
          }

          await update(userRef, updateData);

          originalData = { ...originalData, ...updateData };
          localStorage.setItem("userPhone", phone);
          localStorage.setItem("userDistrict", district);
          localStorage.setItem("userSchool", finalSchoolName);
          if (grade) localStorage.setItem("userGrade", grade);

          setFieldsDisabled(true);
          setNavigationLocked(false);

          showModal("Profile Updated Successfully!", "success");

          const modalBtn = document.querySelector('#statusModal .modal-btn');
          if (modalBtn) {
            modalBtn.onclick = () => {
              closeModal();
              window.location.href = "ctc.html";
            };
          }

          window.croppedImageBase64 = null;
          croppedImageBase64 = null;
        } catch (err) {
          console.error("Profile update error:", err);
          showModal(err.message || "Update failed. Please check your connection.", "error");
        }
      });
    }

    // Mobile Toggle
    const mobileToggle = document.getElementById('mobileToggle');
    if (mobileToggle) {
      mobileToggle.addEventListener('click', () => {
        document.getElementById('sidebar').classList.toggle('mobile-active');
      });
    }

    window.logoutUser = () => {
      localStorage.clear();
      window.location.href = "newuser.html";
    };
  </script>
    </div>
  </div>
</body>
